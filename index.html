<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }

        .btn-danger {
            background: #dc3545;
            padding: 8px 12px;
            font-size: 0.9em;
            margin-right: 5px;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
            padding: 8px 12px;
            font-size: 0.9em;
        }

        .search-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 100px;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box input {
            margin: 0;
        }

        .book-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .book-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .book-card p {
            color: #666;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .book-card .isbn {
            background: #e9ecef;
            padding: 5px 10px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            display: inline-block;
            margin-bottom: 15px;
        }

        .book-actions {
            display: flex;
            gap: 5px;
            margin-top: 15px;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .form-row, .search-box {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .book-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Library Management System</h1>
            <p>Manage your book collection with ease</p>
        </header>

        <div class="content">
            <!-- Alert Messages -->
            <div id="alert" class="alert"></div>

            <!-- Add Book Section -->
            <div class="section">
                <h2>📖 Add New Book</h2>
                <form id="addBookForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="title">Book Title</label>
                            <input type="text" id="title" placeholder="Enter book title" required>
                        </div>
                        <div class="form-group">
                            <label for="author">Author</label>
                            <input type="text" id="author" placeholder="Enter author name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn" placeholder="Enter ISBN" required>
                    </div>
                    <button type="submit">Add Book</button>
                </form>
            </div>

            <!-- Search Section -->
            <div class="section">
                <h2>🔍 Search Books</h2>
                <div class="search-box">
                    <input type="text" id="searchTitle" placeholder="Search by title...">
                    <input type="text" id="searchAuthor" placeholder="Search by author...">
                    <input type="text" id="searchISBN" placeholder="Search by ISBN...">
                    <button onclick="searchBooks()">Search</button>
                </div>
                <button class="btn-secondary" onclick="listAllBooks()">Show All</button>
            </div>

            <!-- User Management Section -->
            <div class="section">
                <h2>👥 Manage Users</h2>
                <form id="addUserForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="userName">Name</label>
                            <input type="text" id="userName" placeholder="Enter user name" required>
                        </div>
                        <div class="form-group">
                            <label for="userCategory">Category</label>
                            <select id="userCategory" required>
                                <option value="student">Student</option>
                                <option value="faculty">Faculty</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit">Add User</button>
                </form>
                <div id="userListContainer" style="margin-top:20px;">
                    <h3>Existing Users</h3>
                    <ul id="userList"></ul>
                </div>
            </div>

            <!-- Issue/Return Section -->
            <div class="section">
                <h2>📗 Issue / Return / Reissue</h2>
                <form id="issueForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="issueUser">User ID</label>
                            <input type="number" id="issueUser" placeholder="User ID" required>
                        </div>
                        <div class="form-group">
                            <label for="issueBook">Book ID</label>
                            <input type="number" id="issueBook" placeholder="Book ID" required>
                        </div>
                    </div>
                    <button type="submit">Issue Book</button>
                </form>
                <div id="issueListContainer" style="margin-top:20px;">
                    <h3>Issue Records</h3>
                    <table id="issueTable" style="width:100%; border-collapse: collapse;">
                        <thead>
                            <tr>
                                <th style="border:1px solid #ddd;padding:8px;">ID</th>
                                <th style="border:1px solid #ddd;padding:8px;">User</th>
                                <th style="border:1px solid #ddd;padding:8px;">Book</th>
                                <th style="border:1px solid #ddd;padding:8px;">Issued</th>
                                <th style="border:1px solid #ddd;padding:8px;">Due</th>
                                <th style="border:1px solid #ddd;padding:8px;">Returned</th>
                                <th style="border:1px solid #ddd;padding:8px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Books List Section -->
            <div class="section">
                <h2>📚 Books List</h2>
                <div id="bookList" class="book-list">
                    <div class="loading">Loading books...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';

        // Show alert message
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            setTimeout(() => {
                alert.className = 'alert';
            }, 3000);
        }

        // Add book form submission
        document.getElementById('addBookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const book = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                isbn: document.getElementById('isbn').value
            };

            try {
                const response = await fetch(`${API_URL}/books`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(book)
                });

                if (response.ok) {
                    showAlert('✓ Book added successfully!', 'success');
                    document.getElementById('addBookForm').reset();
                    listAllBooks();
                } else {
                    showAlert('✗ Failed to add book', 'error');
                }
            } catch (error) {
                showAlert(`✗ Error: ${error.message}`, 'error');
            }
        });

        // Load and display all books
        async function listAllBooks() {
            try {
                const response = await fetch(`${API_URL}/books`);
                const books = await response.json();
                displayBooks(books);
            } catch (error) {
                showAlert(`✗ Error loading books: ${error.message}`, 'error');
            }
        }

        // Search books
        async function searchBooks() {
            const title = document.getElementById('searchTitle').value;
            const author = document.getElementById('searchAuthor').value;
            const isbn = document.getElementById('searchISBN').value;

            let url = `${API_URL}/books/search?`;
            if (title) url += `title=${encodeURIComponent(title)}&`;
            if (author) url += `author=${encodeURIComponent(author)}&`;
            if (isbn) url += `isbn=${encodeURIComponent(isbn)}&`;

            try {
                const response = await fetch(url);
                const books = await response.json();
                displayBooks(books.length > 0 ? books : []);
                if (books.length === 0) {
                    showAlert('No books found matching your search', 'error');
                }
            } catch (error) {
                showAlert(`✗ Error searching books: ${error.message}`, 'error');
            }
        }

        // Display books in grid
        function displayBooks(books) {
            const bookList = document.getElementById('bookList');
            
            if (books.length === 0) {
                bookList.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">No books found</p>';
                return;
            }

            bookList.innerHTML = books.map(book => `
                <div class="book-card">
                    <h3>${book.title}</h3>
                    <p><strong>Author:</strong> ${book.author}</p>
                    <div class="isbn">ISBN: ${book.isbn}</div>
                    <div class="book-actions">
                        <button class="btn-warning" onclick="editBook(${book.id})">✏️ Edit</button>
                        <button class="btn-danger" onclick="deleteBook(${book.id})">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Delete book
        async function deleteBook(bookId) {
            if (!confirm('Are you sure you want to delete this book?')) return;

            try {
                const response = await fetch(`${API_URL}/books/${bookId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('✓ Book deleted successfully!', 'success');
                    listAllBooks();
                } else {
                    showAlert('✗ Failed to delete book', 'error');
                }
            } catch (error) {
                showAlert(`✗ Error: ${error.message}`, 'error');
            }
        }

        // Edit book (opens form with existing data)
        async function editBook(bookId) {
            // Fetch the book details
            try {
                const response = await fetch(`${API_URL}/books`);
                const books = await response.json();
                const book = books.find(b => b.id === bookId);

                if (book) {
                    const newTitle = prompt('Enter new title:', book.title);
                    const newAuthor = prompt('Enter new author:', book.author);
                    const newISBN = prompt('Enter new ISBN:', book.isbn);

                    if (newTitle && newAuthor && newISBN) {
                        const updateResponse = await fetch(`${API_URL}/books/${bookId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                title: newTitle,
                                author: newAuthor,
                                isbn: newISBN
                            })
                        });

                        if (updateResponse.ok) {
                            showAlert('✓ Book updated successfully!', 'success');
                            listAllBooks();
                        } else {
                            showAlert('✗ Failed to update book', 'error');
                        }
                    }
                }
            } catch (error) {
                showAlert(`✗ Error: ${error.message}`, 'error');
            }
        }

        // ---- USER MANAGEMENT ----
        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = {
                name: document.getElementById('userName').value,
                category: document.getElementById('userCategory').value
            };
            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(user)
                });
                if (response.ok) {
                    showAlert('✓ User added!', 'success');
                    document.getElementById('addUserForm').reset();
                    listUsers();
                } else {
                    showAlert('✗ Failed to add user', 'error');
                }
            } catch (err) {
                showAlert(`✗ Error: ${err.message}`, 'error');
            }
        });

        async function listUsers() {
            try {
                const resp = await fetch(`${API_URL}/users`);
                const users = await resp.json();
                const ul = document.getElementById('userList');
                ul.innerHTML = users.map(u => `<li>ID ${u.id} - ${u.name} (${u.category})</li>`).join('');
            } catch (err) {
                showAlert(`✗ Error loading users: ${err.message}`, 'error');
            }
        }

        // ---- ISSUE MANAGEMENT ----
        document.getElementById('issueForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const issue = {
                user_id: parseInt(document.getElementById('issueUser').value),
                book_id: parseInt(document.getElementById('issueBook').value)
            };
            try {
                const resp = await fetch(`${API_URL}/issues`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(issue)
                });
                if (resp.ok) {
                    showAlert('✓ Book issued!', 'success');
                    document.getElementById('issueForm').reset();
                    listIssues();
                } else {
                    const errObj = await resp.json();
                    showAlert(`✗ ${errObj.error || 'Issue failed'}`, 'error');
                }
            } catch (err) {
                showAlert(`✗ Error: ${err.message}`, 'error');
            }
        });

        async function listIssues() {
            try {
                const resp = await fetch(`${API_URL}/issues`);
                const data = await resp.json();
                const tbody = document.querySelector('#issueTable tbody');
                tbody.innerHTML = data.map(i => {
                    return `<tr>
                        <td style="border:1px solid #ddd;padding:8px;">${i.id}</td>
                        <td style="border:1px solid #ddd;padding:8px;">${i.user_id}</td>
                        <td style="border:1px solid #ddd;padding:8px;">${i.book_id}</td>
                        <td style="border:1px solid #ddd;padding:8px;">${i.issue_date.split('T')[0]}</td>
                        <td style="border:1px solid #ddd;padding:8px;">${i.due_date.split('T')[0]}</td>
                        <td style="border:1px solid #ddd;padding:8px;">${i.return_date ? i.return_date.split('T')[0] : '-'}</td>
                        <td style="border:1px solid #ddd;padding:8px;">
                            ${!i.return_date ? `<button class="btn-secondary" onclick="returnIssue(${i.id})">Return</button>` : ''}
                            ${!i.return_date ? `<button class="btn-warning" onclick="reissueIssue(${i.id})">Reissue</button>` : ''}
                        </td>
                    </tr>`;
                }).join('');
            } catch (err) {
                showAlert(`✗ Error loading issues: ${err.message}`, 'error');
            }
        }

        async function returnIssue(id) {
            try {
                const resp = await fetch(`${API_URL}/issues/${id}/return`, { method: 'PUT' });
                if (resp.ok) {
                    showAlert('✓ Book returned', 'success');
                    listIssues();
                } else {
                    const errObj = await resp.json();
                    showAlert(`✗ ${errObj.error || errObj.message}`, 'error');
                }
            } catch (err) {
                showAlert(`✗ Error: ${err.message}`, 'error');
            }
        }

        async function reissueIssue(id) {
            try {
                const resp = await fetch(`${API_URL}/issues/${id}/reissue`, { method: 'PUT' });
                if (resp.ok) {
                    showAlert('✓ Book reissued', 'success');
                    listIssues();
                } else {
                    const errObj = await resp.json();
                    showAlert(`✗ ${errObj.error || errObj.message}`, 'error');
                }
            } catch (err) {
                showAlert(`✗ Error: ${err.message}`, 'error');
            }
        }

        // Load all data on page load
        window.addEventListener('load', () => {
            listAllBooks();
            listUsers();
            listIssues();
        });
                showAlert(`✗ Error: ${error.message}`, 'error');
            }
        }

        // Load all books on page load
        window.addEventListener('load', listAllBooks);
    </script>
</body>
</html>
