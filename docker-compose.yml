version: '3.8'

services:
  library-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lib_app_demo
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=lib.py
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Optional: Nginx reverse proxy (uncomment to use)
